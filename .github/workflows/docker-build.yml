name: Docker Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production_images:
    name: Production Images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: production
      POSTGRES_PASSWORD: ci-docker-password
      DATABASE_URL: postgresql://postgres:ci-docker-password@postgres:5432/lms_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ci-docker-jwt-secret-32-characters-min
      JWT_RESET_SECRET: ci-docker-reset-secret-32-characters-min
      CADDY_ACME_EMAIL: ops@example.com
      API_HOST: api.example.com
      STUDENT_HOST: student.example.com
      ADMIN_HOST: admin.example.com
      PORTAL_HOST: portal.example.com
      COURSES_HOST: courses.example.com
      ALERTMANAGER_WEBHOOK_URL: https://alerts.example.com/lms-platform
      CORS_ORIGINS: https://student.example.com,https://admin.example.com,https://portal.example.com,https://courses.example.com
      APP_PUBLIC_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WEB_STUDENT_URL: http://localhost:3100
      NEXT_PUBLIC_WEB_SALES_URL: http://localhost:3103
      NEXT_PUBLIC_TENANT_ID: tenant-1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: node scripts/check-production-env.js
      - run: docker compose -f deployment/production/docker-compose.prod.yml config --quiet
      - run: docker compose -f deployment/production/docker-compose.prod.yml build api
      - run: docker compose -f deployment/production/docker-compose.prod.yml build migrate
      - run: docker compose -f deployment/production/docker-compose.prod.yml build web-student
      - run: docker compose -f deployment/production/docker-compose.prod.yml build web-admin
      - run: docker compose -f deployment/production/docker-compose.prod.yml build web-sales
      - run: docker compose -f deployment/production/docker-compose.prod.yml build super-portal
